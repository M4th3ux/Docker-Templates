services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - /path/to/qbittorrent/appdata:/config
      - ${DownloadsPath}:/downloads #optional
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    stop_grace_period: "10s" #optional
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      # Opcional: descomente e troque pelo IP real do servidor
      # - JELLYFIN_PublishedServerUrl=http://192.168.0.10
    volumes:
      - jelly_data:/config
      - ${DownloadsPath}:/data/movies
      # tmpfs para transcode com limite de 2 GB (sintaxe longa do compose)
      - type: tmpfs
        target: /transcode
        tmpfs:
          size: 2G
    devices:
        - /dev/dri:/dev/dri # Libera IGPU para o container
    ports:
      - 8096:8096
      #- 8920:8920 #optional
      #- 7359:7359/udp #optional
      #- 1900:1900/udp #optional
    restart: unless-stopped

volumes:
  jelly_data:
    external: true
